name: Must Watch — Generate

on:
  schedule:
    # Monday, Wednesday, Friday at 10:00 UTC = 6:00 AM ET (EDT, UTC-4).
    # Adjust to "0 11 * * 1,3,5" in winter when EST (UTC-5) is active.
    - cron: "0 10 * * 1,3,5"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          # Full history needed so we can branch cleanly from main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate Must Watch page
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python run.py --auto

      - name: Check for changes to index.html
        id: check_changes
        run: |
          if git diff --quiet index.html; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "index.html unchanged — nothing to publish."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push to main
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "chore: generate Must Watch — $(date -u '+%Y-%m-%d') [skip ci]"
          git push origin main
